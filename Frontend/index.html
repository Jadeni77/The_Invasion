<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Invasion</title>
    <meta name="description"
          content="Hold the line against the horde. Place your defenders, spend your energy, and survive twenty levels of the invasion." />

    <!-- Tints the browser chrome on mobile to the game's own panel colour, so
         the surrounding UI does not sit as a bright band above a dark game. -->
    <meta name="theme-color" content="#241f16" />

    <!-- What a link to the game looks like when it is pasted into a chat. The
         title and description above are not used for that; these are. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Invasion" />
    <meta property="og:description"
          content="Hold the line against the horde. Place your defenders, spend your energy, and survive twenty levels of the invasion." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
