# The frontend gate: lint, the suite, and a production build.
#
# On push as well as pull requests, for the same reason as the backend: a release
# merged locally and pushed to main is not a PR.
name: Frontend

on:
  # Only the long-lived branches on push: that covers a release pushed straight
  # to main, while a feature branch is covered by its pull request instead of
  # running everything twice.
  push:
    branches: [main, develop]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      # 22, matching the machine the game is developed on. Vite 7 wants 20.19+
      # or 22.12+, so 20 was not wrong - only different from what anyone here
      # actually runs.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # A production build, because tests run against source and Vite can fail
      # on things Vitest never sees.
      - name: Build
        run: npm run build
