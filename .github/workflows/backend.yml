# The backend gate: the tests, and the image the deployment actually runs.
#
# Runs on push as well as on pull requests, because a release can reach main by
# either route - `git merge --no-ff develop && git push` is not a PR, and a gate
# that only watches PRs would not see it.
name: Backend

on:
  # Only the long-lived branches on push: that covers a release pushed straight
  # to main, while a feature branch is covered by its pull request instead of
  # running everything twice.
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  # So a run can be started by hand from the Actions tab.
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 21, matching the Dockerfile. This said 17 while the deployment built on
      # 21, so CI had never once compiled the thing that ships.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: chmod +x ./mvnw && ./mvnw -B test

      # `mvnw test` cannot see a Dockerfile that no longer builds - which is how
      # a Lombok version that could not compile under a newer JDK got as far as
      # a deploy. This is the only step that compiles what Render runs.
      - name: Build the deployment image
        run: docker build -t invasion-backend .
