spring.application.name=backend

#server configuratation
#A host that assigns a port (most do) sets PORT; 8080 locally.
server.port=${PORT:8080}

## Database
#
# H2 in memory by default, which is right for local development and wrong for
# anything else: it holds every account and every save in RAM, so a restart
# wipes the lot. A deployed server restarts whenever its host recycles it, and
# a free host recycles it whenever it goes idle.
#
# To point at a real database, set these three in the environment - Spring maps
# SPRING_DATASOURCE_URL onto spring.datasource.url without any change here:
#
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>/<db>
#   SPRING_DATASOURCE_USERNAME=...
#   SPRING_DATASOURCE_PASSWORD=...
#
# The driver and the SQL dialect are deliberately NOT set: both used to name H2
# outright, so pointing the URL at Postgres produced a server that started and
# then failed on the first query. Spring picks the driver from the URL and
# Hibernate picks the dialect from the connection.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=password

## JPA
# `update`, not `create-drop`. create-drop discards every table at shutdown,
# which is invisible locally - the database was in memory anyway - and total
# data loss the first time the deployed server restarts.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## H2 console (development only)
#
# OFF unless asked for. SecurityConfig permits /h2-console/** without
# authentication and disables frame options for it, so wherever this console
# runs it is open to whoever can reach the server - and the console accepts an
# arbitrary JDBC URL, which makes it a way to run code, not merely a way to read
# the data.
#
# H2 stays on the classpath even when the datasource is Postgres, so "we use
# Postgres in production" does not disable it. Only this does.
#
# Set H2_CONSOLE_ENABLED=true locally when you want to inspect the database.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

## CORS
# The browser blocks any response whose origin is not on this list, so a
# deployed frontend must appear here or every request from it fails. Comma
# separated; set CORS_ALLOWED_ORIGINS to the deployed site's origin.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

#Logging (debug
logging.level.com.mygame.backend=DEBUG

## Test accounts
#
# Two accounts are seeded at every boot - see DataInitializer. One has every
# defender maxed and every level open; the other is a brand new player, for
# testing the way in, which is where most of what goes wrong goes wrong.
#
# Both addresses are in that file, so in a public repository they are public
# knowledge. Set SEED_TEST_PLAYERS=false to do without these accounts entirely.
app.seed-test-players=${SEED_TEST_PLAYERS:true}

# The password they are seeded with, hashed at boot.
#
# NOT in the source: a committed hash is a working login on every deployment
# built from that source, which is only harmless while nobody can read it. The
# default below is for a machine nobody else can reach - any deployment must set
# TEST_PLAYER_PASSWORD to something of its own.
#
# Changing it takes effect on the next boot. The maxed account is rebuilt anyway;
# the start-of-game account keeps its progress and has only its password brought
# in line.
app.test-player-password=${TEST_PLAYER_PASSWORD:test123}

## Email confirmation
#
# A registered address has to prove it exists: registration sends a six-digit
# code and login is refused until it is entered. An account created BEFORE this
# existed is grandfathered - see EmailVerificationService.
#
# Addresses listed here skip it, so a developer is not locked out by an SMTP
# outage or a mailbox that was never real. Comma separated. This is how a fresh
# test account gets made without a working inbox:
#
#   AUTH_VERIFICATION_EXEMPT=test@example.com,test2@example.com
#
# Empty in a real deployment, or the exemption is the way in.
auth.verification-exempt=${AUTH_VERIFICATION_EXEMPT:}

# Where confirmation and password-reset mail comes from. With no SMTP
# configured the code is only written to the log, which is fine locally and
# means NOBODY CAN REGISTER in a deployment - set this and the three
# SPRING_MAIL_ variables below before releasing email confirmation.
mail.from=${MAIL_FROM:}
#
# The host, the username and the password come from the environment: Spring
# binds SPRING_MAIL_HOST, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD onto
# spring.mail.* without being named here.
#
# The port and STARTTLS are set here because Spring's defaults are wrong for
# every hosted mail provider there is: port 25 unencrypted, which they all
# refuse. 587 with STARTTLS is what Brevo, SendGrid, Gmail and the rest expect,
# so most deployments need only the three credentials above and nothing else.
#
# A free Render instance is the exception: it blocks outbound 25, 465 and 587,
# and the failure reads as "Couldn't connect to host" rather than anything about
# credentials. 2525 is not blocked and Brevo and Mailjet both accept STARTTLS
# there, so set SPRING_MAIL_PORT=2525. Gmail offers neither and cannot be used
# from that host at all. See docs/deployment.md.
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}

## JWT
# Signs and verifies login tokens. Anyone holding this value can mint a token
# for any account, which is why the real one does not live in the repository:
# set JWT_SECRET in the deployment's environment. The fallback below is a
# development key and the application refuses to start on it against a real
# database - see JwtUtil.
jwt.secret=${JWT_SECRET:development-only-key-not-for-any-deployment-0000000000000000}
jwt.expiration=${JWT_EXPIRATION:86400000}
