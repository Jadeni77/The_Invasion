spring.application.name=backend

#server configuratation
server.port=8080

#Database configuration (H2 for development, will reset as restart)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

#PostgreSQL configuration (for data inspection now)
#spring.datasource.url=jdbc:postgresql://localhost:5432/mygame
